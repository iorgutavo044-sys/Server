# Rafael Host: Minecraft real Java + Bedrock e painel de administração privado.
# Copie .env.exemplo para .env e aceite a EULA conscientemente.
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: rafael-minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565/tcp"
      - "19132:19132/tcp"
      - "19132:19132/udp"
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MC_MEMORY:-6G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      MOTD: "Rafael Host - Publico Java e Bedrock"
      TZ: America/Sao_Paulo
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    volumes:
      - ./data:/data

  portainer:
    image: portainer/portainer-ce:lts
    container_name: rafael-painel
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data
