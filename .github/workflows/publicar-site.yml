name: Publicar site Rafael Host

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar site do GitHub
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
